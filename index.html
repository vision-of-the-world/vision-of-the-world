<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vision of the World</title>

  <style>
    * {

      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    h1 {
      font-size: 1.7rem;
      text-align: center;
      margin-bottom: 8px;
    }
    #status {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 16px;
      font-size: 1.1rem;
      min-height: 1.4em;
    }
    .camera-box {
      position: relative;
      width: 100%;
      max-width: 640px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    video, canvas {
      width: 100%;
      display: block;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 16px 28px;
      font-size: 1.15rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      min-width: 150px;
    }
    #startBtn {
      background: #2563eb;
      color: white;
    }
    #startBtn:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #voiceBtn {
      background: #10b981;
      color: white;
    }
    #voiceBtn.off {
      background: #ef4444;
    }
    #spoken {
      margin-top: 18px;
      font-size: 1.25rem;
      color: #38bdf8;
      text-align: center;
      min-height: 1.5em;
      font-weight: 500;
    }
    .disclaimer {
      margin-top: 28px;
      max-width: 480px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <p id="status">Loading AI model… please wait</p>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <button id="startBtn" disabled>Start Camera</button>
    <button id="voiceBtn">Voice: ON</button>
  </div>

  <p id="spoken"></p>

  <p class="disclaimer">
    Assistive tool only. This is not a replacement for a white cane, guide dog, or professional mobility training. Always use with caution.
  </p>
